[project]
name = "rag1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "veerendra balaji", email = "veerendrabalaji1911@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.0",
    "ipykernel>=7.3.0",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.2",
    "langchain-groq>=1.1.3",
    "langsmith>=0.12.1",
    "numpy>=2.5.2",
    "pymupdf>=1.28.2",
    "pypdf>=6.17.0",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.0.1",
    "streamlit>=1.63.0",
    "torchvision>=0.29.0",
]

[project.scripts]
rag1 = "rag1:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
